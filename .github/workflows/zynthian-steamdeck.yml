name: Zynthian Steam Deck
on:
  push:
    branches: ['codex/zynthian-steamdeck']
    paths: ['tools/zynthian-steamdeck/**', '.github/workflows/zynthian-steamdeck.yml']
  pull_request:
    paths: ['tools/zynthian-steamdeck/**', '.github/workflows/zynthian-steamdeck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/zynthian-steamdeck
      - uses: docker/setup-buildx-action@v3
      - name: Build native x86-64 runtime
        uses: docker/build-push-action@v6
        with:
          context: tools/zynthian-steamdeck
          file: tools/zynthian-steamdeck/Containerfile
          tags: localhost/zynthian-steamdeck:oram
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test stock UI, MIDI, audio, LV2 and fresh-process snapshot restore
        id: jack
        run: |
          mkdir -p results
          chmod 777 results
          docker run --rm --user 1000:1000 -e USER=ubuntu -e HOME=/tmp/zynthian-home --shm-size=256m -v "$PWD/results:/results" localhost/zynthian-steamdeck:oram bash /opt/zynthian-steamdeck/tests/run-smoke.sh
      - name: Capture native backtrace if the JACK integration test fails
        if: failure() && steps.jack.outcome == 'failure'
        run: |
          docker build -t localhost/zynthian-steamdeck:debug - <<'EOF'
          FROM localhost/zynthian-steamdeck:oram
          RUN apt-get update && apt-get install -y --no-install-recommends gdb
          EOF
          docker run --rm --user 1000:1000 -e USER=ubuntu -e HOME=/tmp/zynthian-home -e TEST_OUTPUT=/results/diagnostic -e ZYNTHIAN_TEST_GDB=1 --shm-size=256m -v "$PWD/results:/results" localhost/zynthian-steamdeck:debug bash /opt/zynthian-steamdeck/tests/run-smoke.sh
      - name: Test SteamOS PipeWire audio compatibility
        run: docker run --rm --user 1000:1000 -e USER=ubuntu -e HOME=/tmp/zynthian-home --shm-size=256m -v "$PWD/results:/results" localhost/zynthian-steamdeck:oram bash /opt/zynthian-steamdeck/tests/run-smoke.sh pipewire
      - name: Package Steam Deck installer
        run: |
          mkdir -p bundle
          cp -a tools/zynthian-steamdeck/. bundle/
          docker save -o bundle/zynthian-steamdeck-image.tar localhost/zynthian-steamdeck:oram
          cd bundle
          sha256sum zynthian-steamdeck-image.tar > zynthian-steamdeck-image.tar.sha256
      - name: Verify installer and host PipeWire connection through Distrobox
        run: |
          sudo apt-get update
          sudo apt-get install -y podman distrobox pipewire-bin libspa-0.2-modules
          bash tools/zynthian-steamdeck/tests/install-smoke.sh bundle results/installer
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zynthian-steamdeck-test-evidence
          path: results/
      - uses: actions/upload-artifact@v4
        with:
          name: zynthian-steamdeck-x86_64
          path: bundle/
          compression-level: 1
          retention-days: 30
