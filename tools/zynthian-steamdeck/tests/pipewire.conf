# CI-only virtual output. Real installs use the existing SteamOS audio server.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 256
}
context.objects = [
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = zynthian-test-output
        node.description = "Zynthian test output"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        node.virtual = false
        adapter.auto-port-config = {
            mode = dsp
            monitor = true
            position = preserve
        }
      }
    }
    { factory = metadata
      args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink value = { name = zynthian-test-output } }
        ]
      }
    }
]
